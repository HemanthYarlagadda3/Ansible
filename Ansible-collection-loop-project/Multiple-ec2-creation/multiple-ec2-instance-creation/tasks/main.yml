- name: Create EC2 instances
  amazon.aws.ec2_instance:
    name: "{{ item.name }}"
    key_name: "LUNUX@2"
    instance_type: t3.micro
    security_groups: ["default"]
    region: eu-north-1
    aws_access_key: "{{ ec2_access_key }}"
    aws_secret_key: "{{ ec2_secret_key }}"
    network:
      assign_public_ip: true
    image_id: "{{ item.image }}"
    tags:
      Environment: "{{ item.name }}"
  loop:
    - { image: "ami-0fa91bc90632c73c9", name: "ubuntu-manage-node-1" }
    - { image: "ami-0fa91bc90632c73c9", name: "ubuntu-manage-node-2" }
    - { image: "ami-0c7d68785ec07306c", name: "manage-node-3" }

